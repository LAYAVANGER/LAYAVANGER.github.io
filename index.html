<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Car Racing</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #111; color: white; font-family: Arial, sans-serif; }
    #gameCanvas { display: block; background: #222; }
    #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; }
    #playerID { font-weight: bold; }
    #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 72px; color: yellow; }
    #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; max-width: 150px; }
    #leaderboard h3 { margin: 0 0 5px; font-size: 16px; }
    #leaderboard ol { padding-left: 20px; margin: 0; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">Your ID: <span id="playerID">...</span></div>
<div id="countdown">3</div>
<div id="leaderboard"><h3>Leaderboard</h3><ol id="boardList"></ol></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCDyyx9V85E5Wqtwbo-a0YPDqtTOt2chAA",
    authDomain: "gta-racing-hub.firebaseapp.com",
    databaseURL: "https://gta-racing-hub-default-rtdb.firebaseio.com",
    projectId: "gta-racing-hub",
    storageBucket: "gta-racing-hub.firebasestorage.app",
    messagingSenderId: "546491914038",
    appId: "1:546491914038:web:178635b8c5cc217bc24597",
    measurementId: "G-Q7GJG03N9B"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Canvas setup
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Load track image
  const trackImg = new Image();
  trackImg.src = 'https://i.imgur.com/O3ZQ3jU.png'; // placeholder track image URL

  // Load car image
  const carImg = new Image(); carImg.src = 'https://i.imgur.com/4NZ6uLY.png';

  const playerID = Math.random().toString(36).substring(2, 8);
  document.getElementById('playerID').textContent = playerID;

  const playersRef = db.ref('racingGame/players');

  // Store initial positions for distance
  const startPositions = {};

  const player = { id: playerID, x: 100, y: canvas.height/2, distance: 0, timestamp: Date.now() };
  startPositions[playerID] = { x: player.x, y: player.y };

  playersRef.child(playerID).set(player);
  playersRef.child(playerID).onDisconnect().remove();

  // Countdown
  let count = 3;
  const countdownEl = document.getElementById('countdown');
  const countdownInterval = setInterval(() => {
    count--;
    if (count === 0) { countdownEl.textContent = 'GO!'; }
    else if (count < 0) { clearInterval(countdownInterval); countdownEl.style.display = 'none'; }
    else { countdownEl.textContent = count; }
  }, 1000);

  // Movement
  const keys = {};
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);

  function updatePlayer() {
    if (count < 0) {
      if (keys['ArrowUp']) player.y -= 4;
      if (keys['ArrowDown']) player.y += 4;
      if (keys['ArrowLeft']) player.x -= 4;
      if (keys['ArrowRight']) player.x += 4;
      // calculate distance
      const dx = player.x - startPositions[playerID].x;
      const dy = player.y - startPositions[playerID].y;
      player.distance = Math.hypot(dx, dy);
      player.timestamp = Date.now();
      playersRef.child(playerID).set(player);
    }
  }

  let otherPlayers = {};
  playersRef.on('value', snapshot => {
    otherPlayers = snapshot.val() || {};
    // ensure startPositions
    for (let id in otherPlayers) {
      if (!startPositions[id]) startPositions[id] = { x: otherPlayers[id].x, y: otherPlayers[id].y };
    }
  });

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // draw track
    ctx.drawImage(trackImg, 0, 0, canvas.width, canvas.height);
    // draw players
    for (let id in otherPlayers) {
      const p = otherPlayers[id];
      ctx.drawImage(carImg, p.x, p.y, 40, 20);
      ctx.fillStyle = 'white'; ctx.fillText(id, p.x, p.y - 5);
    }
  }

  function updateLeaderboard() {
    const list = Object.values(otherPlayers);
    list.sort((a, b) => b.distance - a.distance);
    const ol = document.getElementById('boardList');
    ol.innerHTML = '';
    list.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.id;
      ol.appendChild(li);
    });
  }

  function gameLoop() {
    updatePlayer();
    draw();
    updateLeaderboard();
    requestAnimationFrame(gameLoop);
  }
  gameLoop();
</script>
</body>
</html>
