<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Car Racing</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      background: #222;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
    }
    #playerID {
      font-weight: bold;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  Your ID: <span id="playerID">...</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
  // Firebase config (replace with your own Firebase project config)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Setup canvas
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const playerID = Math.random().toString(36).substring(2, 8);
  document.getElementById('playerID').textContent = playerID;

  const playersRef = db.ref('racingGame/players');

  const player = {
    id: playerID,
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    color: '#' + Math.floor(Math.random()*16777215).toString(16),
    timestamp: Date.now()
  };

  playersRef.child(playerID).set(player);
  playersRef.child(playerID).onDisconnect().remove();

  const keys = {};
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);

  function updatePlayer() {
    if (keys['ArrowUp']) player.y -= 3;
    if (keys['ArrowDown']) player.y += 3;
    if (keys['ArrowLeft']) player.x -= 3;
    if (keys['ArrowRight']) player.x += 3;
    player.timestamp = Date.now();
    playersRef.child(playerID).set(player);
  }

  let otherPlayers = {};
  playersRef.on('value', snapshot => {
    otherPlayers = snapshot.val() || {};
  });

  function drawPlayers() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let id in otherPlayers) {
      const p = otherPlayers[id];
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 30, 30);
      ctx.fillStyle = 'white';
      ctx.fillText(id, p.x, p.y - 5);
    }
  }

  function gameLoop() {
    updatePlayer();
    drawPlayers();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
